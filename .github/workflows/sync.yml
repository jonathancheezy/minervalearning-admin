name: Sync from Minerva

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Checkout Minerva
        uses: actions/checkout@v4
        with:
          repository: jonathancheezy/Minerva
          ref: main
          path: minerva
          token: ${{ secrets.GH_PAT }}

      - name: Copy files and push
        run: |
          cp minerva/parent_registration.html .
          cp minerva/admin_dashboard.html .
          cp minerva/i18n.js .
          git config user.email "poseidon@openclaw.ai"
          git config user.name "Poseidon"
          git add parent_registration.html admin_dashboard.html i18n.js
          git commit -m "Sync from Minerva main - $(date)" && git push origin master || echo "Nothing to push"
